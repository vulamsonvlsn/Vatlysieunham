<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLSN – Quản lý Team</title>
<meta name="theme-color" content="#4E9A1E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VLSN Team">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar đen + vùng làm việc trắng; xanh lá là màu hành động. Chủ đề sáng theo nhận diện VLSN (xanh lá – trắng – đen). */
:root{
  --green:#4E9A1E; --green-brand:#86C440; --green-soft:#EEF6E6;
  --ink:#121412; --paper:#FFFFFF; --mist:#F5F7F3; --line:#E1E6DC; --muted:#69705F;
  --ok:#3E8E1A; --late:#C98A06; --late-soft:#FFF6DD; --bad:#C2412D; --bad-soft:#FCEBE7;
  --doing:#2F6FB0; --doing-soft:#E7F0FA; --wait:#6B3FB0; --wait-soft:#F1EAFB; --back:#B4570F; --back-soft:#FDEBDC; --idle:#9AA192; --idle-soft:#F0F2ED;
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f-body);background:var(--mist);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.app{display:grid;grid-template-columns:236px 1fr;height:100%}
aside{background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:18px 14px;gap:16px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center}
.brand img{width:46px;height:46px;border-radius:10px;background:#fff;padding:3px}
.brand b{font-size:15px;letter-spacing:.02em;display:block}
.brand small{color:#A9B3A0;font-size:12px}
nav{display:flex;flex-direction:column;gap:2px}
nav .sec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#7F8977;padding:10px 10px 4px}
nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:#D9E0D3;text-decoration:none;font-weight:500}
nav a:hover{background:#22261F}
nav a.on{background:var(--green-brand);color:var(--ink);font-weight:700}
nav a .badge{margin-left:auto;background:#fff;color:var(--ink);border-radius:10px;padding:0 7px;font-size:12px;font-weight:700}
nav a .dot{width:8px;height:8px;border-radius:2px;background:#5E6656;flex:none}
nav a.on .dot{background:var(--ink)}
.stbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:#F3F0FF;border:1px solid #D9D0FA;border-radius:10px;padding:8px 10px;margin:-2px 0 12px;font-size:13px}.stbar label{display:flex;align-items:center;gap:6px;font-weight:600}.stbar select{border:1px solid var(--line);border-radius:7px;padding:5px 6px;font:inherit}
#devBar{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:40;display:none;align-items:center;gap:12px;background:#2D1F6B;color:#fff;border-radius:12px;padding:8px 10px 8px 14px;font-size:13px;box-shadow:0 8px 24px #0003;max-width:min(920px,calc(100vw - 40px))}#devBar button{border:0;border-radius:8px;background:#fff;color:#2D1F6B;font-weight:700;padding:6px 10px;cursor:pointer;white-space:nowrap}
.who{margin-top:auto;border-top:1px solid #2C3128;padding-top:14px;display:flex;flex-direction:column;gap:6px}
.who label{font-size:12px;color:#A9B3A0}
.who select{background:#1C1F1A;border:1px solid #3A4035;color:#fff;border-radius:8px;padding:8px}
.who .roles{display:flex;gap:4px;flex-wrap:wrap}
main{overflow-y:auto;padding:22px 26px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:24px;font-weight:800}
.top p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.savest{font-size:12.5px;color:#2F5E12;background:var(--green-soft);border:1px solid #CFE6B8;padding:6px 10px;border-radius:8px}.savest.err{color:var(--bad);background:var(--bad-soft);border-color:#EFC2B8}
.demo-note{background:var(--green-soft);border:1px solid #CFE6B8;color:#2F5E12;padding:6px 10px;border-radius:8px;font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sub{font-weight:400;color:var(--muted);font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--green)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:#3F8414}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--green-brand);outline-offset:2px}
select.f,input.f,textarea.f{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--paper);min-width:0;width:100%}
.row select.f,.row input.f{width:auto}
textarea.f{resize:vertical}
.f:disabled,.f[readonly]{background:var(--mist);color:#3D4237}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}.seg.big button{padding:9px 18px;font-size:15px}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--mist)}
.tw{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ok{background:var(--green-soft);color:var(--ok)} .s-late{background:var(--late-soft);color:#946300} .s-bad{background:var(--bad-soft);color:var(--bad)}
.s-doing{background:var(--doing-soft);color:var(--doing)} .s-wait{background:var(--wait-soft);color:var(--wait)} .s-back{background:var(--back-soft);color:var(--back)} .s-idle{background:var(--idle-soft);color:#5F6658}
.chip{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--mist);border:1px solid var(--line);white-space:nowrap}
.chip.g{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{height:6px;border-radius:5px;background:var(--line);overflow:hidden;display:flex;min-width:60px}
.bar i{display:block;height:100%}
.muted{color:var(--muted)}
.view{display:none}.view.on{display:block}
/* Tổng quan – cột */
.cols{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:4px}
.col{background:#E3F1D6;border:1px solid #C9E2B2;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:300px;color:var(--ink)}
.col .ch{display:flex;align-items:center;gap:8px}
.col .ch b{font-size:16px}
.col .ch .cnt{margin-left:auto;background:var(--paper);border:1px solid #C9E2B2;border-radius:14px;padding:2px 10px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.col .bar{background:#C9E2B2;height:5px}
.col .add{background:rgba(255,255,255,.6);border:1px dashed #9CC57A;color:#2F5E12;border-radius:9px;padding:8px;cursor:pointer;font-weight:600}
.col .add:hover{border-color:var(--green);background:var(--paper)}
.tk{background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 10px;cursor:pointer;border-left:4px solid var(--idle);text-align:left;width:100%;border-top:0;border-right:0;border-bottom:0;display:flex;flex-direction:column;gap:3px}
.tk:hover{outline:2px solid var(--green-brand)}
.tk b{font-size:13px}
.tk span{font-size:12px;color:var(--muted)}
.tk.k-ok{border-left-color:var(--ok)} .tk.k-late{border-left-color:var(--late)} .tk.k-bad{border-left-color:var(--bad)} .tk.k-doing{border-left-color:var(--doing)} .tk.k-wait{border-left-color:var(--wait)} .tk.k-back{border-left-color:var(--back)}
.more{color:var(--muted);font-size:12.5px;text-align:center}
.alert{background:var(--paper);border:1px solid #EFC2B8;border-left:5px solid var(--bad);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.alert h2{font-size:15px;margin-bottom:8px;color:var(--bad)}
.al-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 18px}
.al{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.al:hover b{text-decoration:underline}
.al .late{font-weight:800;color:var(--bad);font-variant-numeric:tabular-nums;min-width:52px}
.al .m{font-size:12.5px;color:var(--muted)}
/* Lịch tuần */
.wk{display:grid;grid-template-columns:64px repeat(7,minmax(118px,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);min-width:900px}
.wk .h{background:var(--ink);color:#fff;font-weight:700;padding:8px;text-align:center;font-size:13px}
.wk .h.today{background:var(--green-brand);color:var(--ink)}
.wk .tm{padding:6px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);font-variant-numeric:tabular-nums;background:var(--mist)}
.wk .cell{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:4px;min-height:40px}
.cls{border-radius:7px;padding:5px 7px;font-size:12px;cursor:pointer;border:1px solid var(--line);background:var(--paper);text-align:left;width:100%}
.cls b{display:block;font-size:12.5px}
.cls span{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cls.off{border-left:4px solid var(--ink)} .cls.onl{border-left:4px solid var(--green-brand)}
.cls.lack{background:var(--late-soft)}
.cls:hover{border-color:var(--green)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.zone>h2{font-size:16px;font-weight:800;padding:10px 14px;border-radius:10px 10px 0 0;color:#fff;background:var(--ink);display:flex;justify-content:space-between}
.zone.onl>h2{background:var(--green);}
.zone .zb{border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;background:var(--paper)}
details.kh>summary{cursor:pointer;padding:9px 14px;font-weight:700;background:var(--mist);border-bottom:1px solid var(--line);list-style:none;display:flex;gap:4px}
details.kh>summary span:last-child{margin-left:auto}
details.kh>summary::-webkit-details-marker{display:none}
details.kh>summary:before{content:"▸ ";color:var(--muted)}
details.kh[open]>summary:before{content:"▾ "}
/* Trực lớp – nhóm lớp */
.grp{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.grp .gh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.grp .gh b{font-size:15px}
.strip{display:flex;gap:6px;flex-wrap:wrap}
.ss{position:relative;width:62px;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:var(--paper);padding:0;text-align:center}
.ss .no{display:block;font-size:11px;font-weight:700;padding:2px 0;background:var(--idle-soft);color:#5F6658}
.ss .dt{display:block;font-size:17px;font-weight:700;padding:3px 0 1px;font-variant-numeric:tabular-nums}
.ss .wd{display:block;font-size:10.5px;color:var(--muted);padding-bottom:3px}
.ss.k-ok .no{background:var(--ok);color:#fff} .ss.k-late .no{background:var(--late);color:#fff} .ss.k-bad .no{background:var(--bad);color:#fff}
.ss.k-doing .no{background:var(--doing);color:#fff} .ss.k-wait .no{background:var(--wait);color:#fff} .ss.k-back .no{background:var(--back);color:#fff}
.ss.today{outline:2px solid var(--green-brand)}
.ss:hover{border-color:var(--green)}
.ss .rm{position:absolute;top:0;right:0;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;width:16px;height:16px;line-height:16px;padding:0;cursor:pointer;display:none;border-radius:0 0 0 6px}
.ss:hover .rm,.ss:focus-within .rm{display:block}
.ss.addb{border-style:dashed;display:grid;place-items:center;color:var(--muted);font-weight:700;min-height:62px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(18,20,18,.45);display:none;align-items:flex-start;justify-content:center;padding:32px 16px;z-index:20;overflow-y:auto}
.ov.on{display:flex}
.vmode{display:flex;flex-wrap:wrap;gap:4px}.vmode button{background:#2A2F26;color:#C8D1BF;border:1px solid #3A4035;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;cursor:pointer}.vmode button.on{background:var(--green-brand);color:#11140F;border-color:var(--green-brand)}

.lvw{overflow:auto;max-height:72vh}.lvt{border-collapse:separate;border-spacing:0;font-size:12px}.lvt th,.lvt td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;vertical-align:top;min-width:96px;background:var(--paper)}
.lvt thead th{position:sticky;top:0;z-index:3;background:var(--green-soft);font-weight:700;text-align:center;white-space:nowrap}.lvt thead th.me{background:#CFE8B8}
.lvt .stk{position:sticky;left:0;z-index:2;min-width:74px;background:#F4F7EF;text-align:left}.lvt thead .stk{z-index:4}.lvt .stk2{position:sticky;left:74px;z-index:2;min-width:52px;background:#FCE3C4;font-weight:700;color:#7A3E00}
.lvt .dy.today{color:var(--green)}.lvt tr.eod td,.lvt tr.eod th{border-bottom:2px solid #C9D3BE}
.fs{display:flex;flex-direction:column;gap:1px;border-radius:7px;padding:3px 6px;margin:2px 0;font-weight:700;font-size:11.5px;text-align:left;border:0;width:100%;cursor:default}
.fs span{font-weight:500;font-size:10.5px}.fs.free{background:#CBEFC0;color:#1E4D12;flex-direction:row;align-items:center;justify-content:space-between}.fs.free .t[role=button]{cursor:pointer}
.fs.busy{background:#FFD9A8;color:#7A3D00;cursor:pointer}.fs.busy.out{outline:1.5px dashed var(--bad)}.fs.busy.day{background:#DCE7FF;color:#1D3F8A}.fadd{border:0;background:#1E4D12;color:#fff;border-radius:5px;width:20px;height:20px;line-height:18px;font-weight:700;cursor:pointer;padding:0}
.lvme td{vertical-align:top;min-width:110px}.lvme td.lvc .lvadd{display:block;width:100%;margin-top:3px;border:1px dashed var(--line);background:none;border-radius:7px;color:var(--muted);font-weight:700;padding:3px 0;cursor:pointer;opacity:.55}.lvme td.lvc:hover .lvadd,.lvme .lvadd:focus{opacity:1;border-color:var(--green);color:var(--green);background:#f0faea}.lvme th.lvb{text-align:left;vertical-align:top;min-width:70px;white-space:nowrap;position:sticky;left:0;background:var(--card,#fff);z-index:1}.lvme tbody tr+tr td,.lvme tbody tr+tr th{border-top:2px solid var(--line,#e5e7eb)}.lvme .lvr-s th.lvb{color:#b7791f}.lvme .lvr-c th.lvb{color:#2b6cb0}.lvme .lvr-t th.lvb{color:#6b46c1}.lvme .fs{display:block}.lvme .fs span.tkn{display:block;font-weight:500}.lvme th.today{color:var(--green)}.lvme .fs{cursor:pointer}
.sow{overflow:auto;max-height:74vh;border:1px solid var(--line);border-radius:12px;background:var(--paper)}.sot{border-collapse:separate;border-spacing:0;font-size:12px}
.sot th,.sot td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 4px;white-space:nowrap;background:var(--paper)}
.sot thead th{position:sticky;z-index:3;text-align:center;font-weight:700;background:#F4F7EF}.sot thead tr.h0 th{top:0;color:var(--muted);font-weight:600}.sot thead tr.h1 th{top:24px}.sot thead tr.h2 th{top:50px}.sot thead tr.h3 th{top:74px;font-size:10.5px;color:var(--muted)}
.sot .s1{position:sticky;left:0;z-index:2;min-width:52px}.sot .s2{position:sticky;left:52px;z-index:2;min-width:150px;text-align:left}.sot .s3{position:sticky;left:202px;z-index:2;min-width:70px;text-align:left;box-shadow:2px 0 0 #C9D3BE}
.sot thead .s1,.sot thead .s2,.sot thead .s3{z-index:5}.g-dd{background:#FFF59A!important}.g-bt{background:#D7ECFF!important}.g-kt{background:#FCE6D2!important}.g-cs{background:var(--green-soft)!important}
.sot td.sa{text-align:center;min-width:42px;position:relative}.sot td.sa select{border:0;background:transparent;font-weight:700;font-size:12px;width:40px;text-align:center;cursor:pointer}
.sot .hbm{position:absolute;right:1px;top:0;font-size:10px;text-decoration:none}.sot .si{border:1px solid var(--line);border-radius:5px;padding:2px 3px;font-size:12px;text-align:center}
.sot .sd{width:38px;border:1px solid var(--line);border-radius:4px;font-size:11px;text-align:center}.sot td.sb.late{background:#F4CCCC}.sot td.sb,.sot td.sk{text-align:center}
.snb{border:0;background:transparent;cursor:pointer;opacity:.25;font-size:12px;padding:0 2px}
.nxg{border:1px solid #0002;background:#fff9;border-radius:6px;font-size:10.5px;font-weight:700;padding:1px 6px;margin-left:6px;cursor:pointer;color:inherit}.nxg.on{background:var(--ink);color:#fff}
.sot td.sa.cu{background:repeating-linear-gradient(45deg,#F1F3EE,#F1F3EE 4px,#E7EBE2 4px,#E7EBE2 8px);color:var(--muted);font-size:10.5px;font-weight:700}.mvc{display:block;font-size:10px;font-weight:700;color:#4B3A99;background:#F3F0FF;border-radius:5px;padding:0 4px;width:max-content;margin-top:1px}
.sot input.si{font-size:14px;font-weight:700;text-align:center;height:30px;padding:2px 4px}.sot .vr{color:var(--bad)!important;font-weight:800}.sot .vg{color:var(--ok)!important;font-weight:800}.sot .vk{color:var(--ink)!important}.sot span.vr,.sot span.vg,.sot span.vk{font-weight:800}
.kt2{display:flex;gap:4px;align-items:stretch;justify-content:center}.kt2>div{display:flex;flex-direction:row;align-items:center;gap:2px;border-radius:7px;padding:2px 3px}.kt2 .k1{background:#fff;border:1px solid var(--line)}.kt2 .k2 input.si{background:#FBFAFF}.kt2 .k2 input::placeholder{color:#A899E6;font-weight:600}.kt2 .k2{background:#F3F0FF;border:1px dashed #CFC4F5}.kt2 .k2.has{border-style:solid;border-color:#9C8BE0}
.kt2 .kl{display:none;font-size:9.5px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}.kt2 .k2 .kl{color:#5B45C2}.kh1{font-weight:800;color:var(--ink)}.kh2{font-weight:800;color:#5B45C2}

.zg{display:flex;gap:8px;flex-wrap:wrap}.zgi{position:relative}.zgi img{width:120px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.zgx{position:absolute;top:3px;right:3px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:20px;padding:0}
.att{display:inline-flex;gap:5px;align-items:center;font-weight:600;color:var(--ink);font-size:12.5px;white-space:nowrap;border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer}
.fm .att{flex-direction:row;display:inline-flex}
.att input{accent-color:var(--green);width:16px;height:16px}
.vo{display:inline-flex;gap:6px;align-items:center}
.vo img{width:38px;height:38px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
@media (max-width:600px){.hsr2{grid-template-columns:22px 1fr 80px;}.hsr2 .att,.hsr2 .vo{grid-column:2/-1}}
.seg.rad{align-self:flex-start}
.seg.rad label{cursor:pointer;display:block}
.seg.rad input{position:absolute;opacity:0;width:0;height:0}
.seg.rad span{display:block;padding:8px 22px;font-weight:600;color:var(--muted)}
.seg.rad input:checked+span{background:var(--green);color:#fff}
.seg.rad input:focus-visible+span{outline:3px solid var(--green-brand);outline-offset:-3px}
.seg.rad input:disabled+span{cursor:not-allowed}
.rp th,.rp td{border:1px solid var(--line);text-align:center}
.rp td:first-child,.rp th:first-child{text-align:left}
.rp td.n,.rp th.n{text-align:right}
.rp thead th{color:var(--ink);font-weight:700;font-size:12px;white-space:normal}
.rp .c-truc{background:#DDF2CF}.rp .c-kem{background:#FFF5CC}.rp .c-gs{background:#FCEFD9}.rp .c-man{background:#DFF5F5}.rp .c-phat{background:#FCE3DE}.rp .c-dt{background:#E8E4FA}.rp .c-pay{background:#DDF2CF}
.rpw td.pay{background:#F3FAEC;font-weight:600}
.rpw .stk{position:sticky;left:0;background:var(--paper);z-index:1;box-shadow:1px 0 0 var(--line)}.rpw thead .stk{background:var(--paper)}
.rp tfoot td{background:var(--mist);font-variant-numeric:tabular-nums}
.rp .mi{width:72px;text-align:right;padding:4px 6px}
.lnk{border:0;background:none;padding:0;font-weight:700;cursor:pointer;color:var(--ink);text-align:left}
.lnk:hover{color:var(--green);text-decoration:underline}
@media (max-width:1100px){.g2,.two{grid-template-columns:1fr}}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{padding:10px}nav{flex-direction:row;flex-wrap:wrap}nav .sec{display:none}.who{margin:0;border:0;padding:0}main{padding:16px}.fm{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#mbar,#msheet{display:none}
.bcgv{font-size:12.5px;color:#4A5144;font-weight:600;margin-top:2px}
tr.bcgh td{background:#EEF4E6;border-top:2px solid #CFE0BC;font-weight:700}
.masknote{position:fixed;right:12px;bottom:12px;z-index:40;background:#1C1F1A;color:#E7F2DC;border:1px solid #4E9A1E;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2);pointer-events:none}

.vmsel{width:100%;background:#22261F;color:#fff;border:1px solid #3A4035;border-radius:8px;padding:8px 10px;font-weight:600}
.wme{display:flex;flex-direction:column;gap:2px;padding:2px 2px 4px}.wme small{font-size:12px;color:#A9B3A0;font-weight:600;text-transform:uppercase;letter-spacing:.05em}.wme b{font-size:19px;line-height:1.25;color:#fff}
.sfbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;padding:8px 10px;background:#fff;border:1px solid var(--line,#E3E7DE);border-radius:12px}
.sfc{border:1px solid #D6DCCF;background:#F6F8F3;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.sfc b{display:inline-block;min-width:18px;padding:0 5px;margin-left:3px;border-radius:9px;background:#E3E8DC;font-size:11.5px}
.sfc.on{background:var(--green-brand);border-color:var(--green-brand)}
.sfc.on b{background:#fff}
.sfg{display:inline-flex;align-items:center;gap:4px;border-radius:999px}

 body.mob .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}

 #msheet .grab{width:42px;height:5px;border-radius:3px;background:#4A5144;margin:2px auto 10px}

 #msheet .who{display:flex;margin-top:12px}
 #msheet #logoutBtn,#msheet #pwBtn{display:block}
 #msheet .inst{display:flex;gap:10px;align-items:center;background:#22261F;border-radius:12px;padding:10px 12px;margin-bottom:10px}
 #msheet .inst b{display:block}
 #msheet .inst small{color:#AEB7A6}
}

function wireLogin(){

    $L('#lgPwGo').disabled=true;$L('#lgPwGo').textContent='Đang đăng nhập…';
    try{const {data:ok,error:e0}=await SBC.rpc('can_login',{e:em});if(e0)throw e0;
      if(!ok)throw new Error('Email này chưa có trong danh sách nhân sự. Hãy liên hệ quản trị để được thêm.');

      const {error}=await SBC.auth.signInWithOtp({email:lgEmail,options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
      $L('#lgStep1').style.display='none';$L('#lgStep2').style.display='flex';$L('#lgMsg').textContent='Đã gửi mã tới '+lgEmail+'. Nhập mã trong email (hoặc bấm đường link trong email).';$L('#lgCode').focus()}
    catch(e){$L('#lgErr').textContent=VI_ERR(msgOf(e))}
    $L('#lgSend').disabled=false;$L('#lgSend').textContent='Gửi mã đăng nhập'};
  $L('#lgEmail').onkeydown=e=>{if(e.key==='Enter')$L('#lgSend').click()};
  $L('#lgCode').onkeydown=e=>{if(e.key==='Enter')$L('#lgVerify').click()};
  $L('#lgBack').onclick=()=>{$L('#lgStep2').style.display='none';$L('#lgStep1').style.display='flex';$L('#lgErr').textContent=''};
  $L('#lgVerify').onclick=async()=>{$L('#lgErr').textContent='';$L('#lgVerify').disabled=true;

async function fetchAll(){const out=[];let from=0;
  for(;;){const {data,error}=await SBC.from('records').select('c,id,j,updated_at').not('j','is',null).order('updated_at').order('c').order('id').range(from,from+999);
    if(error)throw error;out.push(...data);$L('#bootMsg')&&($L('#bootMsg').textContent='Đang tải dữ liệu… '+out.length+' mục');if(data.length<1000)break;from+=1000}
  return out}
async function importSeed(){
  bootCard('<h1>Nhập dữ liệu ban đầu</h1><p class="muted" id="imMsg">Đang tải file seed.json…</p><div class="lgbar"><i id="imBar"></i></div>');
  const r=await fetch('seed.json',{cache:'no-store'});if(!r.ok)throw new Error('Không tìm thấy file seed.json cạnh index.html');
  const recs=await r.json();let done=0,chunk=[],size=0;
  const flush=async()=>{if(!chunk.length)return;const {error}=await SBC.from('records').upsert(chunk,{onConflict:'c,id'});if(error)throw error;done+=chunk.length;chunk=[];size=0;
    $L('#imMsg').textContent='Đã nhập '+done+'/'+recs.length+' mục…';$L('#imBar').style.width=(100*done/recs.length).toFixed(1)+'%'};
  for(const x of recs){chunk.push({c:x.c,id:x.id,j:x.j});size+=x.j.length;if(chunk.length>=200||size>800000)await flush()}
  await flush();
}

      await importSeed();recs=await fetchAll();
    }

    const me=staff.find(s=>(s.email||'').toLowerCase()===email&&s.tt!=='Ngưng hoạt động');
    if(!me)return bootCard('<p class="lgerr">Email '+email.replace(/</g,'&lt;')+' chưa gắn với nhân sự nào đang hoạt động.</p><p class="muted">Quản trị vào Nhân sự → sửa thông tin → điền đúng email này.</p><button class="btn" onclick="logout()">Đăng xuất</button>');
    screen('app');
    startApp({sb:SBC,me:me.ten,email,admin:!!admin,records:recs,D:Object.assign({staff:[],classes:[],hist:{},kem:[],de:{},mo:{},mentors:{}},REF)});
  }catch(e){BOOTING=false;bootCard('<p class="lgerr">Không tải được dữ liệu: '+msgOf(e).replace(/</g,'&lt;')+'</p><button class="btn pri" onclick="location.reload()">Thử lại</button><button class="btn ghost" onclick="logout()">Đăng xuất</button>')}
}

function genSessions(mk,onlyCls){
  const [y,m]=mk.split('-').map(Number);const last=Math.min(28,new Date(y,m,0).getDate()); // chỉ sinh buổi từ ngày 1–28 hằng tháng
  const list=S.sess[mk]??=[];
  classes().filter(c=>!onlyCls||c.id===onlyCls).forEach(c=>{
    for(let d=1;d<=last;d++){const dt=new Date(y,m-1,d);c.lich.filter(l=>l.thu===thuOf(dt)).forEach(l=>{
      const id=`${c.id}_${d}_${l.bd}`;if(list.find(s=>s.id===id))return;
      const s={id,type:'truc',cls:c.id,date:at(dt,l.bd),bd:l.bd,kt:l.kt,lam:c.ta[0]||'',noidung:'',bc:'',state:null};
      const h=D.hist[`${c.ten}|${d}/${m}`];
      if(h){s.lam=h.lam||s.lam;s.bc=h.kq||'';s.old=true;s.state=h.tt==='Hoàn thành'?'Hoàn thành':h.tt==='Hoàn thành muộn'?'Nộp muộn':null}
      list.push(s);
    })}
  });
  list.sort((a,b)=>a.date-b.date);
}

const hanOf=it=>it.type==='truc'?day0(addD(it.date,1)):(it.han||null);
const GRACE=12*36e5; // sau hạn 12 giờ vẫn nộp được (tính nộp muộn); quá 12 giờ thì khóa
function st(it){
  if(['Đã duyệt','Hoàn thành','Nộp muộn','Chờ duyệt'].includes(it.state))return it.state;
  const h=hanOf(it);
  if(h&&h<NOW)return it.state==='Bị trả lại'?'Bị trả lại':(NOW-h<=GRACE?'Trễ hạn':'Quá hạn');
  if(it.state==='Bị trả lại')return 'Bị trả lại';
  if(it.date&&day0(it.date)>day0(NOW))return 'Chưa đến';
  return 'Đang làm';
}

  const C=visClasses().filter(c=>(!f.hinh||c.hinh===f.hinh)&&(!f.coso||c.coso===f.coso)&&(!f.khoi||c.khoi===f.khoi)&&(!f.gv||c.gv===f.gv)&&(!f.ta||c.ta.includes(f.ta)));
  const sel=(id,lab,arr,v)=>`<select class="f" id="${id}" aria-label="${lab}"><option value="">${lab}</option>${arr.map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  const monthOpts=Object.keys(S.months).sort().map(m=>`<option value="${m}" ${m===S.month?'selected':''}>Tháng ${+m.slice(5)}/${m.slice(0,4)}</option>`).join('');
  const lack=classes().filter(c=>c.siso&&taNeedC(c)>c.ta.length);
  el.innerHTML=head('Lịch trực lớp',`${C.length} lớp · ${C.reduce((a,c)=>a+c.lich.length,0)} buổi mỗi tuần. Lịch này tự sinh các buổi trong mục Trực lớp.`,
    `<select class="f" id="lm" aria-label="Chọn tháng">${monthOpts}</select>${isAdmin()&&Object.keys(S.months).length>1?`<button class="btn danger" id="delMonth">🗑 Xóa lịch tháng ${+S.month.slice(5)}</button>`:''}${mgr?`<button class="btn" id="newMonth">⧉ Tạo lịch tháng mới</button><button class="btn pri" id="addCls">＋ Thêm lớp</button>`:''}`)+
  `${syncBar()}<div class="row" style="margin-bottom:12px"><div class="seg" role="group" aria-label="Kiểu xem"><button class="${LT.mode==='grid'?'on':''}" data-m="grid">Lưới tuần</button><button class="${LT.mode==='list'?'on':''}" data-m="list">Danh sách</button><button class="${LT.mode==='load'?'on':''}" data-m="load">Tải trợ giảng</button></div>
    ${sel('fh','Online + Offline',['Online','Offline'],f.hinh)}${sel('fc','Mọi cơ sở',CS_LIST,f.coso)}${sel('fk','Mọi khối',['KHTN','10','11','12'],f.khoi)}${sel('fg','Mọi giáo viên',GVs,f.gv)}${sel('ft','Mọi trợ giảng',TAs,f.ta)}</div>
  ${lack.length&&mgr?`<div class="card" style="margin-bottom:12px;border-color:#EBCB78;background:var(--late-soft)"><b>⚠ ${lack.length} lớp thiếu trợ giảng</b> <span class="muted">(sĩ số ≥20 cần 1, ≥40 cần 2, ≥60 cần 3; lớp từ 30 HS mà trợ giảng đều cấp 1 cần 2)</span>: ${lack.map(c=>`<button class="chip" style="cursor:pointer" data-cls="${c.id}">${esc(c.ten)} · thiếu ${taNeedC(c)-c.ta.length}</button>`).join(' ')}</div>`:''}
  <div id="lb"></div>`;
  const body=$('#lb');const today=thuOf(NOW);
  if(LT.mode==='grid'){
    const times=[...new Set(C.flatMap(c=>c.lich.map(l=>l.bd)))].sort();
    let h=`<div class="tw"><div class="wk"><div class="h">Giờ</div>${THU.map(t=>`<div class="h ${t===today?'today':''}">${THU_FULL[t]}${t===today?' · hôm nay':''}</div>`).join('')}`;
    times.forEach(tm=>{h+=`<div class="tm">${tm}</div>`;THU.forEach(t=>{const items=C.flatMap(c=>c.lich.filter(l=>l.thu===t&&l.bd===tm).map(l=>({c,l})));
      h+=`<div class="cell">${items.map(({c,l})=>`<button class="cls ${c.hinh==='Online'?'onl':'off'} ${c.siso&&taNeedC(c)>c.ta.length?'lack':''}" data-cls="${c.id}"><b>${esc(c.ten)}</b><span>${esc(GV_SHORT[c.gv]||c.gv)} · đến ${l.kt}</span><span>${c.ta.length?esc(c.ta.map(short).join(', ')):'<i>Chưa có TA</i>'}</span></button>`).join('')}</div>`})});
    body.innerHTML=h+`</div></div><div class="legend" style="margin-top:10px"><span><i style="background:var(--ink)"></i>Offline</span><span><i style="background:var(--green-brand)"></i>Online</span><span><i style="background:var(--late-soft);border:1px solid #EBCB78"></i>Thiếu trợ giảng</span><span>Bấm vào lớp để ${mgr?'sửa':'xem'}</span></div>`;
  }else if(LT.mode==='list'){
    const zone=(hinh)=>{const Z=C.filter(c=>c.hinh===hinh);return `<div class="zone ${hinh==='Online'?'onl':''}"><h2><span>${hinh.toUpperCase()}</span><span>${Z.length} lớp</span></h2><div class="zb">${['KHTN','10','11','12'].map(k=>{const K=Z.filter(c=>c.khoi===k);if(!K.length)return'';
      return `<details class="kh" open><summary><span>${k==='KHTN'?'Khoa học tự nhiên (cấp 2)':'Khối '+k}</span><span class="muted">${K.length} lớp</span></summary><div class="tw"><table><thead><tr><th>Lớp</th>${hinh==='Offline'?'<th>Cơ sở</th>':''}<th class="n">Sĩ số</th><th>Giáo viên</th><th>Lịch học</th><th>Trợ giảng</th><th>Sổ</th></tr></thead><tbody>
      ${K.map(c=>`<tr class="click" data-cls="${c.id}"><td><b>${esc(c.ten)}</b></td>${hinh==='Offline'?`<td>${esc(c.coso||'—')}</td>`:''}<td class="n">${c.siso??'—'}</td><td>${esc(GV_SHORT[c.gv]||c.gv)}</td><td>${c.lich.map(l=>`<span class="chip">${l.thu} ${l.bd}–${l.kt}</span>`).join(' ')}</td><td>${c.ta.map(t=>esc(short(t))).join(', ')||'<span class="pill s-late">Chưa có</span>'}</td><td>${soBtn(c)}</td></tr>`).join('')}</tbody></table></div></details>`}).join('')||'<div class="muted" style="padding:12px">Không có lớp.</div>'}</div></div>`};
    body.innerHTML=`<div class="two">${zone('Offline')}${zone('Online')}</div>`;
  }else{
    const L={};classes().forEach(c=>c.ta.forEach(t=>{const o=L[t]??={c2:0,c3:0};c.khoi==='KHTN'?o.c2++:o.c3++}));
    const R=Object.entries(L).map(([t,o])=>({t,...o,tong:o.c2*.5+o.c3})).sort((a,b)=>b.tong-a.tong);
    body.innerHTML=`<div class="card tw" style="max-width:820px"><h2>Tải trợ giảng tháng ${+S.month.slice(5)} <span class="sub">cấp 2 tính 0,5 · cấp 3 tính 1, như công thức trong Sheet</span></h2><table><thead><tr><th>Trợ giảng</th><th class="n">Lớp cấp 2</th><th class="n">Lớp cấp 3</th><th class="n">Tổng tải</th><th>Xếp loại</th></tr></thead><tbody>${R.map(o=>`<tr><td><b>${esc(o.t)}</b></td><td class="n">${o.c2}</td><td class="n">${o.c3}</td><td class="n"><b>${String(o.tong).replace('.',',')}</b></td><td>${o.tong<=3?'<span class="pill s-ok">Có thể nhận thêm</span>':o.tong<=5?'<span class="pill s-late">Mức tải vừa</span>':'<span class="pill s-bad">Nhiều lớp</span>'}</td></tr>`).join('')}</tbody></table></div>`;
  }
  bindSync();$('#lm').onchange=e=>{S.month=e.target.value;if(!S.sess[S.month])genSessions(S.month);rerender()};
  el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{LT.mode=b.dataset.m;rerender()});
  [['fh','hinh'],['fc','coso'],['fk','khoi'],['fg','gv'],['ft','ta']].forEach(([id,k])=>$('#'+id).onchange=e=>{LT.f[k]=e.target.value;rerender()});
  el.querySelectorAll('[data-cls]').forEach(b=>b.onclick=()=>clsModal(b.dataset.cls));
  if(mgr){$('#addCls').onclick=()=>clsModal(null);$('#newMonth').onclick=newMonth}
  if($('#delMonth'))$('#delMonth').onclick=()=>{const k=S.month,rep=(S.sess[k]||[]).filter(x=>hasReport(x)).length;
    if(rep){openMd(`<h3>Không xóa được lịch tháng ${+k.slice(5)}</h3><p class="muted" style="margin:0">Tháng này đã có ${rep} buổi trực có báo cáo. Hãy xóa từng lớp hoặc từng buổi thay vì xóa cả tháng.</p><div class="row" style="justify-content:flex-end"><button class="btn" id="x">Đóng</button></div>`);$('#x').onclick=closeMd;return}
    confirmDel(`Xóa lịch tháng ${+k.slice(5)}/${k.slice(0,4)}?`,`Xóa ${(S.months[k]||[]).length} lớp và toàn bộ buổi trực đã sinh của tháng này.`,'Xóa lịch tháng',()=>{delete S.months[k];delete S.sess[k];S.month=Object.keys(S.months).sort().pop();toast('Đã xóa lịch tháng')})};
};
function newMonth(){
  const keys=Object.keys(S.months).sort(),last=keys[keys.length-1];let [y,m]=last.split('-').map(Number);m++;if(m>12){m=1;y++}
  const k=`${y}-${p2(m)}`;S.months[k]=S.months[last].map(c=>({...c,id:c.id+'-'+k,lich:c.lich.map(l=>({...l})),ta:[...c.ta]}));
  S.month=k;genSessions(k);rerender();toast(`Đã tạo lịch tháng ${m}/${y} từ tháng trước và sinh sẵn các buổi trực`);
}
const opts=(arr,v,lab=x=>x)=>arr.map(x=>`<option value="${esc(x)}" ${x===v?'selected':''}>${esc(lab(x))}</option>`).join('');
const sessRow=l=>`<div class="sess"><select class="f s1" aria-label="Thứ">${opts(THU,l.thu)}</select><input class="f s2" type="time" value="${l.bd}" aria-label="Bắt đầu"> – <input class="f s3" type="time" value="${l.kt}" aria-label="Kết thúc"><button class="btn sm s4" type="button" aria-label="Xóa buổi">✕</button></div>`;
function bindSess(){$$('#m_sess .s4').forEach(b=>b.onclick=()=>b.parentElement.remove())}
function clsModal(id){
  const mgr=isMgr(),dis=mgr?'':'disabled';
  const c=id?clsById(id):{id:'c'+Date.now(),ten:'',khoi:'10',hinh:'Offline',coso:'Bách Khoa',siso:'',gv:GVs[0],lich:[{thu:'T2',bd:'18:10',kt:'19:40'}],ta:[]};
  openMd(`<h3>${id?esc(clsTitle(c)):'Thêm lớp mới'}</h3>${id&&bookOf(c)?`<div class="row" style="margin-top:-6px">${soBtn(c)}<span class="muted" style="font-size:12.5px">${esc(bookOf(c).t)}</span></div>`:''}<div class="fm">
   <label>Tên lớp<input class="f" id="m_ten" value="${esc(c.ten)}" ${dis}></label>
   <label>Khối<select class="f" id="m_khoi" ${dis}>${opts(['KHTN','10','11','12'],c.khoi)}</select></label>
   <label>Hình thức<select class="f" id="m_hinh" ${dis}>${opts(['Offline','Online'],c.hinh)}</select></label>
   <label>Cơ sở (lớp offline)<select class="f" id="m_coso" ${dis}><option value="">—</option>${opts(CS_LIST,c.coso)}</select></label>
   <label>Sĩ số<input class="f" id="m_siso" type="number" min="0" value="${c.siso??''}" ${dis}></label>
   <label>Giáo viên<select class="f" id="m_gv" ${dis}>${opts(GVs,c.gv)}</select></label>
   <div class="full fld">Buổi học trong tuần<div id="m_sess">${c.lich.map(sessRow).join('')}</div>${mgr?'<div><button class="btn sm" id="m_addS" type="button">＋ Thêm buổi trong tuần</button></div>':''}</div>
   ${[0,1,2].map(i=>`<label>Trợ giảng trực ${i+1}<select class="f" id="m_ta${i}" ${dis}><option value="">—</option>${taOpts('truc',c.ta[i])}</select></label>`).join('')}
  </div><div class="row" style="justify-content:space-between">${id&&mgr?'<button class="btn danger" id="m_del">Xóa lớp</button>':'<span></span>'}<div class="row"><button class="btn" id="m_x">Đóng</button>${mgr?'<button class="btn pri" id="m_ok">Lưu</button>':''}</div></div>`);
  $('#m_x').onclick=closeMd;if(!mgr)return;
  $('#m_addS').onclick=()=>{$('#m_sess').insertAdjacentHTML('beforeend',sessRow({thu:'T2',bd:'18:10',kt:'19:40'}));bindSess()};bindSess();
  if(id)$('#m_del').onclick=()=>{S.months[S.month]=classes().filter(x=>x.id!==id);S.sess[S.month]=sessions().filter(s=>s.cls!==id);closeMd();rerender();toast('Đã xóa lớp')};
  $('#m_ok').onclick=()=>{
    const n={...c,ten:$('#m_ten').value.trim()||'Lớp mới',khoi:$('#m_khoi').value,hinh:$('#m_hinh').value,coso:$('#m_hinh').value==='Offline'?$('#m_coso').value:'',siso:+$('#m_siso').value||null,gv:$('#m_gv').value,
      lich:$$('#m_sess .sess').map(r=>({thu:r.querySelector('.s1').value,bd:r.querySelector('.s2').value,kt:r.querySelector('.s3').value})),ta:[0,1,2].map(i=>$('#m_ta'+i).value).filter(Boolean)};
    const arr=classes(),i=arr.findIndex(x=>x.id===c.id);i>=0?arr[i]=n:arr.push(n);
    // buổi tương lai chưa có báo cáo: sinh lại theo lịch mới
    S.sess[S.month]=sessions().filter(s=>!(s.cls===n.id&&s.date>NOW&&!s.bc&&!s.extra));genSessions(S.month,n.id);
    sessions().filter(s=>s.cls===n.id&&s.date>NOW&&!s.bc).forEach(s=>s.lam=n.ta[0]||'');
    closeMd();rerender();toast('Đã lưu lớp '+n.ten+' – các buổi sắp tới cập nhật theo lịch mới');
  };
}

/* ---------- TRỰC LỚP (gom theo lớp) ---------- */
const TL={khoi:'',hinh:'',ta:'',q:'',onlyBad:false,dn:''};
// lọc hoàn thành: done = đã xong; todo = chưa xong và đã đến ngày (không tính buổi "Chưa đến")
const dnOK=(x,f)=>!f||(f==='done'?done(st(x)):(!done(st(x))&&st(x)!=='Chưa đến'));
VIEWS['truc-lop']=el=>{
  const mgr=isMgr();const sess=sessions();
  let C=visClasses('truclop').filter(c=>(!TL.khoi||c.khoi===TL.khoi)&&(!TL.hinh||c.hinh===TL.hinh)&&(!TL.ta||c.ta.includes(TL.ta)||sess.some(s=>s.cls===c.id&&s.lam===TL.ta))&&(!TL.q||c.ten.toLowerCase().includes(TL.q.toLowerCase())));
  if(TL.onlyBad)C=C.filter(c=>sess.some(s=>s.cls===c.id&&st(s)==='Quá hạn'));
  if(TL.dn)C=C.filter(c=>sess.some(s=>s.cls===c.id&&dnOK(s,TL.dn)));
  const monthOpts=Object.keys(S.months).sort().map(m=>`<option value="${m}" ${m===S.month?'selected':''}>Tháng ${+m.slice(5)}/${m.slice(0,4)}</option>`).join('');
  const sel=(id,lab,arr,v)=>`<select class="f" id="${id}" aria-label="${lab}"><option value="">${lab}</option>${arr.map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  el.innerHTML=head(has(ME(),'Giáo viên')&&!isMgr()?'Lớp phụ trách':'Trực lớp',`Mỗi lớp là một nhóm, các buổi từ ngày 1–28 hằng tháng tự sinh từ Lịch trực lớp. Bấm vào buổi để xem hoặc viết nhận xét.`,`<select class="f" id="tm" aria-label="Chọn tháng">${monthOpts}</select>`)+
  `${syncBar()}<div class="row" style="margin-bottom:12px"><input class="f" id="tq" placeholder="Tìm lớp…" value="${esc(TL.q)}" aria-label="Tìm lớp" style="width:150px">${sel('tk','Mọi khối',['KHTN','10','11','12'],TL.khoi)}${sel('th','Online + Offline',['Online','Offline'],TL.hinh)}${sel('tt','Mọi trợ giảng',TAs,TL.ta)}<select class="f" id="tdn" aria-label="Hoàn thành"><option value="">Hoàn thành + chưa</option><option value="done" ${TL.dn==='done'?'selected':''}>✓ Đã hoàn thành</option><option value="todo" ${TL.dn==='todo'?'selected':''}>⏳ Chưa hoàn thành</option></select>
   <label class="row" style="gap:6px;font-weight:600"><span class="sw"><input type="checkbox" id="tb" ${TL.onlyBad?'checked':''}><span></span></span>Chỉ lớp có buổi quá hạn</label></div>
  <div class="legend" style="margin-bottom:10px">${['Hoàn thành','Nộp muộn','Đang làm','Trễ hạn','Quá hạn','Chưa đến'].map(s=>`<span><i style="background:var(--${KIND[s]==='ok'?'ok':KIND[s]==='idle'?'idle':KIND[s]})"></i>${s}</span>`).join('')}</div>
  ${C.map(c=>{const L=sess.filter(s=>s.cls===c.id);const dn=L.filter(s=>done(st(s))).length;
    return `<div class="grp"><div class="gh"><b>${esc(clsTitle(c))}</b>${c.ta.map(t=>`<span class="chip">${esc(short(t))}</span>`).join(' ')}${soBtn(c)}<span class="muted" style="margin-left:auto;font-variant-numeric:tabular-nums">${dn}/${L.length} buổi đã xong</span><div class="bar" style="width:90px"><i style="width:${pct(dn,L.length)}%;background:var(--green)"></i></div></div>
    <div class="strip">${L.map((s,i)=>{if(!dnOK(s,TL.dn))return '';const k=KIND[st(s)];const same=L.filter(x=>+day0(x.date)===+day0(s.date));const lab=same.length>1?s.date.getDate()+'.'+(same.indexOf(s)+1):s.date.getDate();return `<div class="ss k-${k} ${+day0(s.date)===+day0(NOW)?'today':''}" data-it="${s.id}" role="button" tabindex="0" aria-label="Buổi ${i+1} ngày ${fd(s.date)}${same.length>1?' ca '+(same.indexOf(s)+1):''}: ${st(s)}"><span class="no">${i+1}</span><span class="dt">${lab}</span><span class="wd">${thuOf(s.date)} ${s.bd}</span>${mgr&&!hasReport(s)?`<button class="rm" data-rm="${s.id}" aria-label="Xóa buổi ${i+1}">✕</button>`:''}</div>`}).join('')}
    ${mgr?`<button class="ss addb" data-addss="${c.id}" aria-label="Thêm buổi cho ${esc(c.ten)}">＋<span style="font-size:10.5px;font-weight:600">Thêm buổi</span></button>`:''}</div></div>`}).join('')||'<div class="card muted">Không có lớp phù hợp bộ lọc.</div>'}`;
  bindSync();$('#tm').onchange=e=>{S.month=e.target.value;if(!S.sess[S.month])genSessions(S.month);rerender()};
  $('#tq').oninput=e=>{TL.q=e.target.value;clearTimeout(TL.t);TL.t=setTimeout(()=>{rerender();const i=$('#tq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)};
  [['tk','khoi'],['th','hinh'],['tt','ta']].forEach(([id,k])=>$('#'+id).onchange=e=>{TL[k]=e.target.value;rerender()});
  $('#tb').onchange=e=>{TL.onlyBad=e.target.checked;rerender()};
  $('#tdn').onchange=e=>{TL.dn=e.target.value;rerender()};
  bindItems(el);
  el.querySelectorAll('.ss[data-it]').forEach(e=>e.onkeydown=ev=>{if(ev.key==='Enter')openItem(e.dataset.it)});
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const s=findItem(b.dataset.rm);
    openMd(`<h3>Xóa buổi ${fd(s.date)} của ${esc(clsById(s.cls).ten)}?</h3><p class="muted" style="margin:0">Dùng khi lớp nghỉ buổi này. Việc nhận xét của buổi cũng bị xóa.</p><div class="row" style="justify-content:flex-end"><button class="btn" id="x">Hủy</button><button class="btn pri" id="ok" style="background:var(--bad);border-color:var(--bad)">Xóa buổi</button></div>`);
    $('#x').onclick=closeMd;$('#ok').onclick=()=>{S.sess[S.month]=sessions().filter(x=>x.id!==s.id);closeMd();rerender();toast('Đã xóa buổi '+fd(s.date))}});
  el.querySelectorAll('[data-addss]').forEach(b=>b.onclick=()=>addSessModal(b.dataset.addss));
};
function addSessModal(cid){
  const c=clsById(cid);const l=c.lich[0]||{bd:'18:10',kt:'19:40'};
  openMd(`<h3>Thêm buổi – ${esc(clsTitle(c))}</h3><div class="fm">
   <label>Ngày học<input class="f" type="date" id="a_d" value="${iso(addD(NOW,1))}"></label>
   <label>Trợ giảng phụ trách<select class="f" id="a_ta"><option value="">—</option>${taOpts('truc',c.ta[0])}</select></label>
   <label>Giờ bắt đầu<input class="f" type="time" id="a_bd" value="${l.bd}"></label><label>Giờ kết thúc<input class="f" type="time" id="a_kt" value="${l.kt}"></label>
   <label class="full">Ghi chú<input class="f" id="a_n" placeholder="VD: Học bù buổi nghỉ ngày 20/11"></label></div>
   <div class="row" style="justify-content:flex-end"><button class="btn" id="x">Hủy</button><button class="btn pri" id="ok">Thêm buổi</button></div>`);
  $('#x').onclick=closeMd;
  $('#ok').onclick=()=>{const d=new Date($('#a_d').value+'T00:00');const s={id:nid('ex'),type:'truc',cls:cid,date:at(d,$('#a_bd').value),bd:$('#a_bd').value,kt:$('#a_kt').value,lam:$('#a_ta').value,noidung:$('#a_n').value,bc:'',state:null,extra:true};

const kemHinh=k=>k.hinh||(/onl|online/i.test(k.ten)?'Online':'Offline');
function kemHours(k){
  if(k.bd&&k.kt){const [a,b]=k.bd.split(':').map(Number),[c,d]=k.kt.split(':').map(Number);const h=(c*60+d-a*60-b)/60;if(h>0)return{h,est:false}}
  const m=String(k.ten).replace(/\s/g,'').match(/(\d{1,2})h(\d{0,2})-(\d{1,2})h(\d{0,2})/i);
  if(m){const h=((+m[3])*60+(+m[4]||0)-(+m[1])*60-(+m[2]||0))/60;if(h>0&&h<6)return{h,est:false}}
  return{h:1.5,est:true};
}
function kemHS(k){
  let n=k.hs.filter(h=>h.ten&&(k.type!=='kemhs'||h.co!==false||!k.state)).length;if(k.type==='kemhs'&&k.hs.some(h=>h.co))n=k.hs.filter(h=>h.ten&&h.co).length;if(k.type==='kemnhom'&&k.hs.some(h=>h.co))n=k.hs.filter(h=>h.ten&&h.co&&!h.req).length;if(!n&&k.nOld)n=k.nOld;
  if(!n&&k.oldkq){const line=(k.oldkq.match(/(?:Số )?Học sinh\s*:\s*(.*)/i)||[])[1]||'';const nb=line.match(/(\d+)\s*(?:bạn|hs)/i);
    n=nb?+nb[1]:line.split(/[,;]|\svà\s/).map(x=>x.trim()).filter(x=>x.length>1).length}
  if(!n){const t=String(k.ten).split(/\d{1,2}\/\d{1,2}|\d{1,2}h/)[0];n=t.split(/[,;]/).filter(x=>x.trim().length>1).length||1}
  const cap=k.type==='kemnhom'&&kemHinh(k)==='Online'?Math.min(n,15):n;
  return{n,cap};
}
function monthReport(mk){
  const [y,m]=mk.split('-').map(Number);const a=new Date(y,m-1,1),b=new Date(y,m,1);
  const upto=NOW<b?NOW:b;
  const items=allItems().filter(it=>it.lam&&it.date&&it.date>=a&&it.date<b);
  const R={};
  const row=n=>R[n]??={ten:n,truc:{ok:0,no:0},kem:{ok:0,no:0,gio:0,hs:0,est:0,cap:0,vang:0},gs:{ok:0,no:0},sd:{ok:0,no:0},late:0,list:[]};
  items.forEach(it=>{const s=st(it);const ok=done(s);if(!ok&&it.date>upto)return;const r=row(it.lam);r.list.push(it);
    if(ok&&s==='Nộp muộn')r.late++;
    if(it.type==='truc')ok?r.truc.ok++:r.truc.no++;
    else if(it.type==='giasu'){if(ok){r.gs.ok++;r.gs.gio=(r.gs.gio||0)+hoursOf(it)}else r.gs.no++}
    else if(it.type==='soande')ok?r.sd.ok++:r.sd.no++;
    else if(it.type==='renluyen'||it.type==='chuyenmon'){}
    else if(ok&&it.type==='kemhs'&&!it.old&&!it.hs.some(h=>h.co)){r.kem.vang++}
    else{if(ok){r.kem.ok++;const H=kemHours(it),N=kemHS(it);r.kem.gio+=H.h;if(H.est)r.kem.est++;r.kem.hs+=N.cap;if(N.cap<N.n)r.kem.cap+=N.n-N.cap}else r.kem.no++}});
  TAs.forEach(t=>row(t));
  Object.values(R).forEach(r=>{r.dt=dtMonthStat(r.ten,mk);r.cm=cmStat(r.ten,mk);r.pay=payOf(r,mk)});
  return Object.values(R).filter(r=>has(r.ten,'Trợ giảng'));
}

function scopes(mod,me=ME()){

  if(it.type==='renluyen'||it.type==='chuyenmon')return it.giao===me||byName[it.lam]?.dandat===me||isMgr(me);
  if(has(me,'Quản lý')&&it.type!=='truc'&&it.giao===me)return true;
  if(has(me,'Giáo viên')&&(gvOf(it)===me||byName[it.lam]?.dandat===me))return true;
  if(it.type==='truc'&&isUqFor(gvOf(it),me))return true;
  if(it.type==='truc'){const c=clsById(it.cls);return c?clsInScope(c,scopes('truclop',me)):false}

function parseLoTrinh(rows,khoi){
  const out=[];let chuong='',nhom='';
  rows.forEach((R,i)=>{R=R||[];const name=(R[1]||'').trim();if(!name||/^VẬT LÝ \d+/i.test(name))return;
    const hasBo=/BỘ\s*1/i.test(R[3]||'');
    if(!hasBo){if(/^CHƯƠNG|^BÀI TOÁN KINH ĐIỂN|^CÁC BÀI TOÁN/i.test(name)){chuong=name;nhom=''}else nhom=name;return}
    const bo=[1,2,3].map(n=>({n,done:String(R[2+2*n]||'').toUpperCase()==='TRUE'})).filter((b,j)=>/BỘ/i.test(R[1+2*b.n]||''));
    out.push({id:`${khoi}-${i}`,khoi,chuong,nhom,bai:name,loai:(R[2]||'').trim()||'15P',bo,link:(R[10]||'').trim(),test:/KIỂM TRA|ĐỀ KIỂM TRA|TỪ ĐẦU ĐẾN HẾT/i.test(name)});
  });
  return out;
}
function loadDe(wb){
  ['10','11','12'].forEach(k=>{const rows=wb['Lớp '+k];if(rows)S.lt[k]=parseLoTrinh(rows,k)});
  const q=wb['Dữ liệu QR'];if(q){S.qr={};q.slice(1).forEach(R=>{if(!R||!R[0])return;const bo=+(String(R[4]||'').match(/\d+/)||[1])[0];S.qr[`${R[0]}|${(R[2]||'').trim()}|${bo}`]={ma:R[5]||'',tt:R[6]||'',gc:R[7]||''}})}

function boState(r,b){const key=`${r.id}|${b.n}`;const t=S.soan.find(x=>x.row===r.id&&x.bo===b.n);

/* ---- Phạm vi công việc của trợ giảng: mặc định theo cấp độ, quản trị tích thêm / bỏ bớt ---- */
const JOBS=[['truc','Trực lớp'],['kem1','Kèm học sinh 1–1'],['kem2','Kèm học sinh 2 bạn'],['kemoff','Kèm nhóm offline'],['kemon','Kèm nhóm online'],['giasu','Gia sư'],['soande','Soạn đề'],['chuyenmon','Soạn chuyên môn']];

const taOpts=(job,v,list=TAs)=>list.map(n=>{const ok=typeof job==='function'?job(n):canJob(n,job);return `<option value="${esc(n)}" ${n===v?'selected':''} ${ok||n===v?'':'disabled'}>${esc(n)}${ok?'':' – '+esc(typeof job==='function'?'ngoài phạm vi công việc':jobWhy(n,job))}</option>`}).join('');
const scopeErr=(n,job)=>canJob(n,job)?'':`${n} ${jobWhy(n,job)} (chỉnh ở Thành viên & phân quyền → Công việc được thực hiện).`;

const csPct=(mk,c)=>{const a=S.csAuto?.[mk]?.[c.ten];if(a&&a.pct!=null)return a.pct;const v=S.cs[mk]?.[c.ten];return v===''||v==null?null:+v};
function csAmount(p,khoi){if(p==null)return null;const K=khoi==='KHTN'?'KHTN':'C3';
  for(const [t,v] of PAY.csNeg[K])if(p<=t)return v;for(const [t,v] of PAY.csPos[K])if(p>=t)return v;return 0}
const hoursOf=it=>{if(it.bd&&it.kt){const [a,b]=it.bd.split(':').map(Number),[c,d]=it.kt.split(':').map(Number);const h=(c*60+d-a*60-b)/60;if(h>0)return h}return kemHours(it).h};
function weeksOf(mk){const [y,m]=mk.split('-').map(Number);const W=[];let d=new Date(y,m-1,1);while(d.getDay()!==1)d=addD(d,1);
  while(d<new Date(y,m,1)){const e=addD(d,7);W.push({a:new Date(d),b:e,done:e<=NOW});d=e}return W}
function cmStat(n,mk){const W=weeksOf(mk);const items=(S.cm||[]).filter(x=>x.lam===n&&x.state!=='Bị trả lại');
  const lv=capOf(n);let thieu=0;const cur={};
  W.forEach(w=>{const inW=items.filter(x=>x.date>=w.a&&x.date<w.b);
    if(lv===1){const c=inW.filter(x=>x.type==='renluyen').length;if(w.done)thieu+=Math.max(0,PAY.rlQuota-c);if(w.a<=NOW&&NOW<w.b)cur.rl=c}
    else if(lv>=2){Object.entries(PAY.cmQuota).forEach(([k,q])=>{const c=inW.filter(x=>x.type==='chuyenmon'&&x.loai===k).length;if(w.done)thieu+=Math.max(0,q-c);if(w.a<=NOW&&NOW<w.b)cur[k]=c})}});
  const tot=lv===1?items.filter(x=>x.type==='renluyen').length:items.filter(x=>x.type==='chuyenmon').length;
  const target=lv===1?PAY.rlQuota*W.length:Object.values(PAY.cmQuota).reduce((a,b)=>a+b,0)*W.length;
  return{lv,thieu,cur,tot,target};
}
function payOf(r,mk){
  const lv=capOf(r.ten);const P={truc:0,kem:0,gs:0,cs:0,phat:0,warn:[]};if(!lv)return null;
  const dbl=c=>lv>=2&&(c.siso||0)>30&&(csPct(mk,c)??0)>80;
  r.list.forEach(it=>{const s=st(it);if(!done(s))return;
    if(it.type==='truc'){const c=clsById(it.cls);P.truc+=PAY.truc*(c&&dbl(c)?2:1)}
    else if(it.type==='kemhs'||it.type==='kemnhom'){
      if(it.type==='kemhs'&&!it.old&&!it.hs.some(h=>h.co))return;
      const H=hoursOf(it);let n=kemHS(it).n||1;if(it.type==='kemnhom'&&kemHinh(it)==='Online')n=Math.min(n,lv>=3?20:15);
      P.kem+=PAY.kem[lv]*H+PAY.them*Math.max(0,n-1);
      if(lv===1&&(it.type==='kemnhom'||n>1))P.warn.push('Cấp 1 chỉ kèm 1–1');}
    else if(it.type==='giasu'){P.gs+=(PAY.gs[lv]||0)*hoursOf(it);if(lv<2)P.warn.push('Gia sư chỉ dành cho cấp 2–3 đã đạt yêu cầu')}
  });
  classes().filter(c=>c.ta.includes(r.ten)).forEach(c=>{const a=csAmount(csPct(mk,c),c.khoi);if(a==null)return;let v=a;if(v>0&&lv>=2&&(c.siso||0)>30)v*=2;if(PAY.csChia&&c.ta.length>1)v/=c.ta.length;P.cs+=v});

  P.phat=r.late*PAY.nopMuon+dm*PAY.diMuon+(lv===2?cm.thieu*PAY.thieuCM:0);P.dm=dm;
  P.tong=P.truc+P.kem+P.gs+P.cs-P.phat;return P;
}

const tabOf=mk=>{const [y,m]=mk.split('-');return `T${+m}_${y}`};
function findTab(wb,mk){const [y,m]=mk.split('-').map(Number);const re=new RegExp('^\\s*T0?'+m+'\\s*[_\\-\\s]\\s*'+y+'\\s*$','i');const k=Object.keys(wb).find(n=>re.test(n));return k?{name:k,rows:wb[k]}:null}
function parseSo(rows){
  const hr=rows.findIndex(R=>R&&R.some(v=>/ĐIỂM DANH/i.test(v||'')));if(hr<0)return null;
  const H=rows[hr]||[],L=rows[hr+1]||[],Dy=rows[hr+2]||[];
  const idx=(R,re)=>{for(let i=0;i<R.length;i++)if(re.test(R[i]||''))return i;return -1};
  const a0=idx(H,/ĐIỂM DANH/i),a1=idx(L,/Số buổi/i),b0=idx(H,/BÀI TẬP VỀ NHÀ/i),b1=idx(L,/NỘP MUỘN|TỈ LỆ/i),k15=idx(H,/KIỂM TRA 15/i),k50=idx(H,/KIỂM TRA 50/i);
  const st=[];for(let r=hr+3;r<rows.length;r++){const R=rows[r]||[];const ten=[R[1],R[2]].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();if(ten&&!/^=/.test(ten))st.push({r,ten,R})}
  const att=[];for(let c=a0;c<(a1>a0?a1:a0+10);c++)att.push({c,day:parseInt(Dy[c])||null,held:st.some(s=>String(s.R[c]||'').trim())});
  const bt=[];if(b0>=0)for(let c=b0;c<(b1>b0?b1:b0+10);c+=2)bt.push(c);
  const isKT=c=>/^\d+$/.test(String(L[c]||'').trim())&&/^(NX|NHẬN XÉT)/i.test(String(L[c+1]||'').trim());const kt=[];
  if(k15>=0)for(let c=k15;c<(k50>k15?k50:k15+16);c+=4)if(isKT(c))kt.push([c,c+2]);

}
// % chăm sóc: HS đạt = đủ buổi (đi học hoặc đã học bù) + BTVN TB ≥ 70% + KT TB ≥ 7
function csCompute(c,mk,wb,b){
  const T=findTab(wb,mk);if(!T)return{err:'Sổ chưa có tab '+tabOf(mk)};const P=parseSo(T.rows);if(!P)return{err:'Không đọc được cấu trúc tab '+T.name};
  const held=P.att.filter(a=>a.held);

  const ktCols=P.kt.filter(([o,l])=>P.st.some(s=>num(s.R[o])!=null||num(s.R[l])!=null));
  const avg=L=>{L=L.filter(x=>x!==undefined);return L.length?L.reduce((p,q)=>p+q,0)/L.length:null};
  const rows=[];
  const QN=new Set((S.so[c.ten]?.quit||[]).map(q=>nrmT(fullHS(q.st||{}))));
  P.st.forEach(s=>{if(QN.has(nrmT(s.ten)))return;const v=a=>String(s.R[a.c]||'').trim().toLowerCase();const i0=held.findIndex(a=>v(a));if(i0<0)return;

    const kt=avg(ktCols.map(([o,l])=>{const lai=num(s.R[l]);if(lai!=null)return lai;if(isNew(s.R[o]))return undefined;return num(s.R[o])??0}));

    rows.push({ten:s.ten,du,tong:Hs.length,thieu,bu,bt,kt,okB,okT,okK,ok:okB&&okT&&okK})});
  const dat=rows.filter(r=>r.ok).length;

}

cmStat=function(n,mk){const W=weeksOf(mk);const items=(S.cm||[]).filter(x=>x.lam===n&&x.state!=='Bị trả lại');const lv=capOf(n);let thieu=0;const cur={};const carry={};
  W.forEach(w=>{const inW=items.filter(x=>x.date>=w.a&&x.date<w.b);
    if(lv===1){const c=inW.filter(isBT1).length+(carry.rl||0);if(w.done)thieu+=Math.max(0,PAY.rlQuota-c);carry.rl=(w.done||(w.a<=NOW&&NOW<w.b))?Math.max(0,c-PAY.rlQuota):c;if(w.a<=NOW&&NOW<w.b)cur.rl=c}
    else if(lv>=2)Object.entries(PAY.cmQuota).forEach(([k,q])=>{const c=inW.filter(x=>x.type==='chuyenmon'&&x.loai===k).length+(carry[k]||0);if(w.done||(w.a<=NOW&&NOW<w.b)){if(w.done)thieu+=Math.max(0,q-c);carry[k]=Math.max(0,c-q)}else carry[k]=c;if(w.a<=NOW&&NOW<w.b)cur[k]=c})});
  const [y,m]=mk.split('-').map(Number);const inM=items.filter(x=>x.date>=new Date(y,m-1,1)&&x.date<new Date(y,m,1));
  const tot=lv===1?inM.filter(isBT1).length:inM.filter(x=>x.type==='chuyenmon').length;
  const target=lv===1?PAY.rlQuota*W.length:Object.values(PAY.cmQuota).reduce((a,b)=>a+b,0)*W.length;

  <div class="muted" style="font-size:12px;margin-top:8px">Điểm danh: x đúng giờ · xm muộn · v vắng · p vắng có phép · new học sinh mới · ô vắng ghi “chưa bù” – bấm để chọn cách học bù: học lớp khác (chuyển x), kèm với trợ giảng (gắn việc kèm, tính khi báo cáo được duyệt), xem video (trợ giảng chụp vở trong việc trực lớp) · 📷 có ảnh vở học bù. Ô “muộn” cạnh BTVN thay cho tô màu ô trong Google Sheets. % CS: đủ buổi + BTVN TB ≥ 70% + KT TB ≥ 7 (rê chuột để xem lý do chưa đạt). ${stu?'Bấm mã HS để sửa/xóa học sinh; bấm “Sửa tên, ngày vào lớp” để sửa ngay trên bảng.':'Chỉ phòng quản lý thêm, sửa, xóa học sinh.'}</div>`;

/* ===================== ĐỢT 14: đứng lớp · vi phạm · tổng quan theo nhóm việc · nguồn ca · gia sư đổi TA ===================== */
// ---------- Nguồn tạo ca kèm ----------
const NG_BU='Học bù';
const NG_LIST=['Học sinh tự đăng ký','Trợ giảng chủ động hẹn học sinh','Ôn tập định kỳ',NG_BU];

// ---------- Vi phạm & phạt ----------
S.vp=[];

const sameMonth=(d,m=NOW)=>d&&d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth();
const vtReal=n=>byName[n]?.vt||[];
const isTAn=n=>vtReal(n).includes('Trợ giảng');
const vpOf=(who,m=NOW)=>S.vp.filter(v=>v.who===who&&sameMonth(v.date,m));
const taVpN=(who,m=NOW)=>vpOf(who,m).filter(v=>v.type===VP_TA).length;   // chỉ trợ giảng: tính giới hạn 3 lần / tháng
const adminsN=()=>STAFF.filter(x=>x.tt!=='Ngưng hoạt động'&&(x.vt||[]).some(v=>v==='Quản trị cấp cao'||v==='Nhà phát triển')).map(x=>x.ten);
function addVp(v){if(S.vp.some(x=>x.sess===v.sess&&x.type===v.type&&x.who===v.who))return;
  S.vp.push({id:nid('vp'),date:new Date(NOW),amt:VP_AMT[v.type]||0,...v});
  const n=v.type===VP_TA?taVpN(v.who):0;const lv=n>=4?' – ĐỀ XUẤT CHO NGHỈ VIỆC':n===3?' – lần vi phạm cuối':n===2?' – cảnh báo lần 2':'';
  notify(v.who,`⚠ Vi phạm: ${v.type} (${v.note||''}) – phạt ${vnd(VP_AMT[v.type])}${n?` · lần ${n} trong tháng${lv}`:''}`);
  [...new Set([...(QLs||[]),...adminsN()])].forEach(q=>notify(q,`⚠ ${v.who}: ${v.type} – ${v.note||''}${n?` (lần ${n}/tháng${lv})`:''}`))}
const rmVp=(sess,type)=>{S.vp=S.vp.filter(x=>!(x.sess===sess&&x.type===type))};

// ---------- Báo cáo đứng lớp (giáo viên) ----------
const GV_START=new Date(2026,10,16);
const gvApplies=s=>s&&s.type==='truc'&&!!clsById(s.cls)?.gv&&s.date>=GV_START;
const taDoneS=s=>['Hoàn thành','Nộp muộn','Đã duyệt'].includes(s.state);
const gvDoneS=s=>!!s.gvr?.at;
const canGVr=(s,me=ME())=>(gvOf(s)||'')===me||isTop(me)||isUqFor(gvOf(s),me);
const _stBase=st;
st=function(it){if(!gvApplies(it))return _stBase(it);
  if(gvDoneS(it)&&taDoneS(it))return (it.state==='Nộp muộn'||it.gvr.late)?'Nộp muộn':'Hoàn thành';
  if(taDoneS(it))return 'Chờ GV';
  const x=_stBase(it);if(gvDoneS(it)&&(x==='Đang làm'||x==='Chưa đến'))return 'Chờ TA';return x};
KIND['Chờ GV']='wait';KIND['Chờ TA']='wait';
const gvView=(me=ME())=>has(me,'Giáo viên')&&!isMgr(me)&&!has(me,'Trợ giảng');
const pairTag=s=>gvApplies(s)?`<span class="ptag"><b class="${taDoneS(s)?'y':'n'}">${taDoneS(s)?'✓':'⏳'} TA</b> · <b class="${gvDoneS(s)?'y':'n'}">${gvDoneS(s)?'✓':'⏳'} GV</b></span>`:'';
const pairWarn=s=>!gvApplies(s)?'':taDoneS(s)&&!gvDoneS(s)?'<div class="pwarn">⚠ Giáo viên chưa hoàn thành báo cáo đứng lớp – ca chưa được chuyển trạng thái.</div>':gvDoneS(s)&&!taDoneS(s)?'<div class="pwarn">⚠ Trợ giảng chưa hoàn thành báo cáo trực lớp – ca chưa được chuyển trạng thái.</div>':'';

// thông tin học sinh của lớp lấy từ sổ theo dõi
const numV=x=>{const n=parseFloat(String(x??'').replace(',','.'));return isNaN(n)?null:n};
function soInfo(c){const so=S.so[c.ten];if(!so)return null;
  const active=so.st.filter(x=>x.att.some(a=>a&&a!=='new'));
  const lastIdx=Math.max(-1,...so.days.map((d,i)=>so.st.some(x=>x.att[i])?i:-1));
  const vang=[];active.forEach(x=>x.att.forEach((a,i)=>{if(a==='v'||a==='p')vang.push({st:x,i,a,d:missDate(so,i)})}));
  const chuaBu=vang.filter(v=>!hbDone(v.st.hb[v.i]));
  const bi=[...Array(so.st[0]?.bt.length||0).keys()].reverse().find(j=>active.some(x=>x.bt[j]&&x.bt[j].p!==''));
  const btv=bi==null?[]:active.map(x=>({st:x,p:x.bt[bi].p})).filter(v=>v.p!=='new'&&(v.p===''||(numV(v.p)??0)<70));
  const kt=[];active.forEach(x=>{[...x.k15.map((o,j)=>({o,lab:'KT 15p #'+(j+1),nd:so.k15Nd?.[j]})),{o:x.k50[0],lab:'KT 50p',nd:so.k50Nd?.[0]}].forEach(({o,lab,nd})=>{if(!o||numV(o.d)==null)return;const e=numV(o.l)??numV(o.d);if(e<7)kt.push({st:x,lab,d:o.d,l:o.l,nd})})});
  return {so,active,vang,chuaBu,bi,btv,kt,lastIdx}}
const nmL=L=>L.length?L.map(x=>esc(fullHS(x.st||x))).join(', '):'';

function gvSection(s){const c=clsById(s.cls),ed=canGVr(s),r=s.gvr||{},assigned=s.lamGoc||s.lam,cur=r.ta||s.lam,I=soInfo(c);
  const li=(t,arr,f)=>`<div class="gvi"><b>${t} (${arr.length})</b>${arr.length?`<div>${arr.slice(0,30).map(f).join(' · ')}${arr.length>30?' …':''}</div>`:'<div class="muted">Không có</div>'}</div>`;
  return `<div class="gvbox" id="gvBox">${isUqFor(gvOf(s))?`<div class="muted" style="font-size:12.5px;margin-bottom:4px">✍️ Bạn được ${esc(gvOf(s))} ủy quyền báo cáo đứng lớp hộ.</div>`:''}<h4>👩‍🏫 Báo cáo đứng lớp – giáo viên ${esc((gvOf(s)||''))} ${r.at?`<span class="pill s-ok">Đã nộp ${fd(r.at)}${r.late?' · muộn':''}${r.by&&r.by!==gvOf(s)?' · '+esc(short(r.by))+' báo cáo hộ':''}</span>`:`<span class="pill s-${NOW>hanOf(s)?'bad':'wait'}">${NOW>hanOf(s)?'Quá hạn – chưa nộp':'Chưa nộp'}</span>`}</h4>
   <div class="row" style="gap:10px;align-items:flex-end;flex-wrap:wrap"><label class="fld" style="flex:1;min-width:240px"><span>Trợ giảng trực buổi này</span><select class="f" id="gv_ta" ${ed?'':'disabled'}>${opts(TAs,cur)}</select></label>
    <label class="gvck"><input type="checkbox" id="gv_dg" ${r.dg!==false?'checked':''} ${ed?'':'disabled'}> Đúng giờ</label></div>
   <div id="gv_w" style="font-size:12.5px;margin-top:4px"></div>
   ${I?`<div class="gvinfo"><div class="muted" style="font-size:12px;margin-bottom:4px">Tự lấy từ sổ theo dõi lớp ${esc(c.ten)}:</div>
     ${li('Học sinh nghỉ chưa học bù',I.chuaBu,v=>`${esc(fullHS(v.st))} <span class="muted">(${buoiLab(I.so,v.i)})</span>`)}
     ${li(`Chưa làm / chưa nộp BTVN${I.bi!=null?' – cột BTVN '+(I.bi+1):''}`,I.btv,v=>`${esc(fullHS(v.st))} <span class="muted">${v.p===''?'chưa nộp':numV(v.p)!=null?v.p+'%':esc(v.p)}</span>`)}
     ${li('Chưa qua bài kiểm tra (dưới 7)',I.kt,v=>`${esc(fullHS(v.st))} <span class="muted">${v.lab}: ${esc(String(v.l!==''&&v.l!=null?v.l:v.d))}</span>`)}</div>`:'<div class="muted" style="font-size:12.5px;margin-top:6px">Lớp chưa có sổ theo dõi trên web – chưa có danh sách học sinh.</div>'}
   <label class="fld full" style="margin-top:8px"><span>Góp ý cho trợ giảng <span style="font-weight:400">· gửi thông báo trực tiếp tới trợ giảng</span></span><textarea class="f" id="gv_gy" rows="2" ${ed?'':'readonly'} placeholder="VD: Nhắc lớp nộp BTVN đầu giờ, điểm danh trước 5 phút">${esc(r.gy||'')}</textarea></label>
   ${ed?`<div class="row" style="justify-content:space-between;margin-top:6px"><span class="muted" style="font-size:12px">Hạn nộp 23:59 ngày ${fd(s.date)} · nộp muộn phạt ${vnd(VP_AMT[VP_GV])}/lần</span><button class="btn pri" id="gv_ok">${r.at?'Cập nhật báo cáo đứng lớp':'Nộp báo cáo đứng lớp'}</button></div>`:''}</div>`}
function bindGv(s){const box=$('#gvBox');if(!box)return;const assigned=s.lamGoc||s.lam;
  const w=()=>{const v=$('#gv_ta').value;$('#gv_w').innerHTML=v&&v!==assigned?`<span style="color:var(--bad);font-weight:600">⚠ Khác trợ giảng được phân công (${esc(assigned||'—')}).</span> Buổi này sẽ tính công cho <b>${esc(v)}</b>; ${esc(short(assigned))} bị ghi vi phạm “tự ý đổi ca không báo” (${vnd(VP_AMT[VP_TA])}), gửi cảnh báo tới trợ giảng, quản lý và quản trị.`:''};
  if($('#gv_ta')){$('#gv_ta').onchange=w;w()}
  if(!$('#gv_ok'))return;
  $('#gv_ok').onclick=()=>{const ta=$('#gv_ta').value,dg=$('#gv_dg').checked,gy=$('#gv_gy').value.trim();const old=s.gvr||{};const first=!old.at;const at0=first?new Date(NOW):old.at;const late=first?NOW>hanOf(s):!!old.late;
    s.gvr={ta,dg,gy,at:at0,late,by:ME()};
    if(ta&&assigned&&ta!==assigned){s.lamGoc=assigned;s.lam=ta;addVp({who:assigned,type:VP_TA,sess:s.id,note:`${titleOf(s)} – ${short(ta)} trực thay`})}
    else if(s.lamGoc&&ta===s.lamGoc){s.lam=s.lamGoc;delete s.lamGoc;rmVp(s.id,VP_TA)}
    if(first&&late)addVp({who:(gvOf(s)||''),type:VP_GV,sess:s.id,note:titleOf(s)});
    if(gy&&gy!==old.gy)notify(ta||s.lam,`Góp ý của ${short((gvOf(s)||''))} về buổi trực ${titleOf(s)}: ${gy}`,s);
    if(!dg&&old.dg!==false)notify(ta||s.lam,`${short((gvOf(s)||''))} ghi nhận bạn không đúng giờ buổi ${titleOf(s)}.`,s);
    closeMd();rerender();toast(st(s)==='Chờ TA'?'Đã nộp – chờ trợ giảng hoàn thành báo cáo trực lớp':first&&late?`Đã nộp (muộn – ghi phạt ${vnd(VP_AMT[VP_GV])})`:'Đã lưu báo cáo đứng lớp')}}
const _trucModal14=trucModal;
trucModal=function(s){_trucModal14(s);if(!gvApplies(s))return;const h=$('#md h3');if(h){if(gvView())h.insertAdjacentHTML('afterbegin','<span class="chip" style="margin-right:6px">Đứng lớp</span>');h.insertAdjacentHTML('afterend',pairWarn(s))}

/* ----- một giao diện duy nhất: chọn khối, các bài × các lớp, sửa ngay trên ô ----- */
function ltOp(c,op,i){const before=ltSnap(c);const P=ltEditable(c.ten);const it=P.items[i];
  if(op==='up'||op==='down'){const k=op==='up'?i-1:i+1;if(k<0||k>=P.items.length)return;[P.items[i],P.items[k]]=[P.items[k],P.items[i]];ltShift(P,Math.min(i,k))}
  else if(op==='skip'){it.skip=!it.skip;if(it.skip)it.d='';ltShift(P,i)}
  else if(op==='del'){P.items.splice(i,1);ltShift(P,i)}
  else if(op==='reset'){delete S.ltc[c.ten]}
  P.by=ME();P.at=new Date(NOW);ltSched.c={};ltCommit(c,before);rerender();
  toast(op==='del'?'Đã xóa buổi – các buổi sau tự dời':op==='skip'?(it.skip?'Đã bỏ qua buổi – các buổi sau tự dời':'Đã học lại buổi này'):op==='reset'?'Đã đưa lớp về lộ trình chung':'Đã đổi thứ tự')}

/* ================= CẢNH BÁO HỌC SINH NGHỈ 4 BUỔI LIÊN TIẾP CHƯA HỌC BÙ ================= */
function absRun(so,st){let run=[],best=null;so.days.forEach((_,i)=>{const a=st.att[i];if(a==='v'||a==='p'){if(hbDone(st.hb[i]))run=[];else{run.push(i);if(run.length>=4)best=[...run]}}else if(a)run=[]});return best}
function absWarnList(){const me=ME(),mgr=isMgr()||isTop();const out=[];
  Object.entries(S.so||{}).forEach(([t,so])=>{const c=classes().find(x=>x.ten===t);if(!c)return;if(!(mgr||c.gv===me||(c.ta||[]).includes(me)))return;
    so.st.forEach(st=>{const r=absRun(so,st);if(!r)return;if(st.absKeep&&st.absKeep.i===r.at(-1)&&st.absKeep.n>=r.length)return;out.push({c,so,st,r})})});return out}
function absWarnCard(){const L=absWarnList();if(!L.length)return '';const mgr=isMgr()||isTop();
  return `<div class="card abw"><h2>🚨 Học sinh nghỉ 4 buổi liên tiếp chưa học bù <span class="sub">${L.length} học sinh</span></h2>
   ${L.map(({c,so,st,r},j)=>`${j===6?`<details class="abm"><summary>Xem thêm ${L.length-6} học sinh</summary>`:''}<div class="abr"><button class="lk" data-abp="${j}"><b>${esc(fullHS(st))}</b></button> <span class="chip">${esc(c.ten)}</span>
     <span>vắng <b>${r.length}</b> buổi liên tiếp: ${r.map(i=>{const d=String(so.days[i]||'?');return esc(dayNo(d)+'/'+(NOW.getMonth()+1)+(d.includes('.')?' ca '+(caNo(so,i)+1):''))}).join(', ')}</span>

     ${mgr?`<span style="flex:1"></span><button class="btn sm" data-abk="${j}">Đã liên hệ, giữ lại</button><button class="btn sm danger" data-abq="${j}">⛔ Cho ra khỏi lớp</button>`:''}</div>${j===L.length-1&&j>=6?'</details>':''}`).join('')}
   <div class="muted" style="font-size:12.5px;margin-top:6px">Học bù xong một buổi thì cảnh báo tự tắt. Cho ra khỏi lớp: học sinh không còn tính vào % chăm sóc của trợ giảng, hoàn tác được trong sổ.</div></div>`}

const isRLS=e=>e&&(e.code==='42501'||/row-level security|permission denied/i.test(e.message||''));
async function sbUpsert(rows){ // trả về danh sách khóa bị từ chối vì không có quyền
  const rej=[];let chunk=[],size=0;
  const flush=async()=>{if(!chunk.length)return;const part=chunk;chunk=[];size=0;
    const {error}=await SB.from('records').upsert(part,{onConflict:'c,id'});
    if(!error)return;if(!isRLS(error))throw error;
    for(const r of part){const {error:e2}=await SB.from('records').upsert([r],{onConflict:'c,id'});if(e2){if(isRLS(e2))rej.push(r.c+'|'+r.id);else throw e2}}};
  for(const r of rows){chunk.push(r);size+=(r.j||'').length;if(chunk.length>=200||size>900000)await flush()}
  await flush();return rej;
}

  SAVING=false;saveStatus();
}
function applyRemote(recs,force){
  if(!recs.length)return false;const cur=force?null:collectAll();let changed=false,roles=false;
  recs.forEach(r=>{const k=r.c+'|'+r.id;
    if(!force&&(r.j?SNAP.get(k)===r.j:!SNAP.has(k)))return; // không có gì mới
    if(!force&&cur.has(k)&&cur.get(k).j!==SNAP.get(k))return; // đang sửa dở trên máy này
    let o=null;if(r.j){try{o=JSON.parse(r.j,revive)}catch(e){return}}changed=true;
    if(ARR[r.c]){const [g,key]=ARR[r.c];const A=g();const i=A.findIndex(x=>x[key]===r.id);if(o){i>=0?A[i]=o:A.push(o)}else if(i>=0)A.splice(i,1);if(r.c==='staff'||r.c==='roles')roles=true}
    else if(r.c==='classes'){const [mk,cid]=r.id.split('~');const A=S.months[mk]??=[];const i=A.findIndex(x=>x.id===cid);if(o){i>=0?A[i]=o.c:A.push(o.c)}else if(i>=0)A.splice(i,1)}
    else if(r.c==='sess'||r.c==='dt'){const M=r.c==='sess'?S.sess:S.dt;Object.values(M).forEach(L=>{const i=L.findIndex(x=>x.id===r.id);if(i>=0)L.splice(i,1)});if(o){(M[o.mk]??=[]).push(o.s);M[o.mk].sort((a,b)=>a.date-b.date)}}
    else if(r.c==='so'){if(o)S.so[r.id]=o;else delete S.so[r.id]}
    else if(r.c==='ltc'){S.ltc??={};if(o)S.ltc[r.id]=o;else delete S.ltc[r.id];ltSched.c={}}
    else if(r.c==='kv')setKV(r.id,o);
    if(r.j)SNAP.set(k,r.j);else SNAP.delete(k);
  });
  if(roles){refreshRoles();initWho()}
  S.notif.sort((a,b)=>b.at-a.at);
  return changed;
}
async function fetchRecords(since){
  const out=[];let from=0;
  for(;;){let q=SB.from('records').select('c,id,j,updated_at').order('updated_at').order('c').order('id').range(from,from+999);
    if(since)q=q.gt('updated_at',since);else q=q.not('j','is',null);
    const {data,error}=await q;if(error)throw error;out.push(...data);if(data.length<1000)break;from+=1000}
  return out;
}
const maxTs=recs=>recs.reduce((m,r)=>r.updated_at>m?r.updated_at:m,'');

async function imgBlob(file,max=1600){
  const url=URL.createObjectURL(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
}
const slug=s=>String(s||'tep').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^a-zA-Z0-9._-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||'tep';
async function uploadImg(file,name){
  const isImg=/^image\//.test(file.type||'');const body=isImg?await imgBlob(file):file;
  const ext=isImg?'jpg':((file.name||'').split('.').pop()||'bin').toLowerCase();
  const path=`${NOW.getFullYear()}-${p2(NOW.getMonth()+1)}/${Date.now().toString(36)}-${slug(name)}.${ext}`;
  const {error}=await SB.storage.from('uploads').upload(path,body,{contentType:isImg?'image/jpeg':(file.type||'application/octet-stream'),upsert:false});
  if(error)throw error;return SB.storage.from('uploads').getPublicUrl(path).data.publicUrl;
}

async function fn(name,body){

}

const b64buf=b64=>{const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return u8.buffer};
// Lấy file Excel của Sheet: ưu tiên đọc thẳng Google Sheet qua hàm "sheet"; chưa cài thì cho chọn file .xlsx
async function sheetBuf(id,label){
  const r=await fn('sheet',{fileId:id});
  if(r.data?.b64)return{buf:b64buf(r.data.b64),src:'Google Sheet'};
  if(r.err==='NOT_SHARED')throw new Error('Sheet "'+label+'" chưa chia sẻ cho email tài khoản dịch vụ (xem HUONG-DAN mục 10)');
  if(r.err!=='NO_FN'&&r.err!=='NO_KEY')throw new Error(r.detail||r.err);

}

function dtSessions(mk){
  if(S.dt[mk])return S.dt[mk];const [y,m]=mk.split('-').map(Number);const L=[];
  for(let d=1;d<=28;d++){const dt=new Date(y,m-1,d);if(dt.getDay()===1)L.push({id:`dt${mk}_${d}`,date:at(dt,'08:00'),chude:'',video:'',att:{},nr:day0(dt)<day0(START())})}

function dtStatus(s,n){const a=s.att[n];if(s.date>NOW)return{k:'idle',t:'Chưa đến'};
  if(s.nr&&!a)return{k:'idle',t:'Không ghi nhận'};
  if(a?.co)return a.gio==='Đến muộn'?{k:'late',t:'Có mặt · đến muộn'}:{k:'ok',t:'Có mặt · đúng giờ'};
  if(a?.anh)return a.nop>dtHan(s)?{k:'late',t:'Học bù muộn'}:{k:'ok',t:'Đã học bù'};
  return NOW>dtHan(s)?{k:'bad',t:'Vắng · quá hạn học bù'}:{k:'doing',t:'Vắng · chờ học bù'};
}
function dtMonthStat(n,mk){const L=dtSessions(mk).filter(s=>s.date<=NOW&&!(s.nr&&!s.att[n]));let co=0,muon=0,bu=0,buMuon=0,thieu=0;
  L.forEach(s=>{const a=s.att[n];if(a?.co){co++;if(a.gio==='Đến muộn')muon++}else if(a?.anh){bu++;if(a.nop>dtHan(s))buMuon++}else thieu++});return{n:L.length,co,muon,bu,buMuon,thieu}}
function weeksOf(mk){const [y,m]=mk.split('-').map(Number);const W=[];let d=new Date(y,m-1,1);while(d.getDay()!==1)d=addD(d,1);const st0=START();
